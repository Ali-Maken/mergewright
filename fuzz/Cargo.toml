[package]
name = "mergewright-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Standalone: not a member of the root workspace (its `members = ["crates/*"]`
# glob does not reach here) and this empty table stops cargo from walking up
# and trying to fold it into that workspace anyway. See fuzz/README.md.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.mergewright-git]
path = "../crates/mergewright-git"

[[bin]]
name = "parse_unified"
path = "fuzz_targets/parse_unified.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_file_list"
path = "fuzz_targets/parse_file_list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_porcelain_v2"
path = "fuzz_targets/parse_porcelain_v2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "conflict_parse"
path = "fuzz_targets/conflict_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blame_porcelain"
path = "fuzz_targets/blame_porcelain.rs"
test = false
doc = false
bench = false

[[bin]]
name = "line_log"
path = "fuzz_targets/line_log.rs"
test = false
doc = false
bench = false

[[bin]]
name = "follow_log"
path = "fuzz_targets/follow_log.rs"
test = false
doc = false
bench = false
