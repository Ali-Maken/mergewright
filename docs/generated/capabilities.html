<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mergewright capabilities</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

:root {
  color-scheme: light dark;
  --bg: #ffffff; --fg: #1b1f23; --muted: #6a737d; --border: #d0d7de;
  --works: #1a7f37; --partial: #9a6700; --unverified: #57606a; --broken: #cf222e;
  --chip-bg: #f6f8fa;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --border: #30363d;
    --works: #3fb950; --partial: #d29922; --unverified: #8b949e; --broken: #f85149;
    --chip-bg: #161b22;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 1.5rem; background: var(--bg); color: var(--fg);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
header h1 { margin: 0 0 0.25rem; font-size: 1.4rem; }
.sub { color: var(--muted); margin: 0 0 1rem; font-size: 0.9rem; }
.stats { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; }
.stat { border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.7rem; font-size: 0.85rem; }
.controls {
  display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
  margin-bottom: 1rem; position: sticky; top: 0; background: var(--bg); padding: 0.5rem 0;
  border-bottom: 1px solid var(--border);
}
input, select {
  background: var(--bg); color: var(--fg); border: 1px solid var(--border);
  border-radius: 6px; padding: 0.35rem 0.5rem; font-size: 0.9rem;
}
#search { flex: 1; min-width: 220px; }
.aspect-filter { display: flex; align-items: center; gap: 0.3rem; font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
.count { color: var(--muted); font-size: 0.85rem; margin-left: auto; }
.cap { border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.6rem; }
.cap-head { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
.id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); font-size: 0.85rem; }
.title { font-weight: 600; }
.status {
  font-size: 0.75rem; font-weight: 600; padding: 0.05rem 0.5rem; border-radius: 999px;
  border: 1px solid currentColor; text-transform: uppercase; letter-spacing: 0.02em;
}
.status.works { color: var(--works); }
.status.partial { color: var(--partial); }
.status.unverified { color: var(--unverified); }
.status.broken { color: var(--broken); }
.area-badge {
  font-size: 0.75rem; color: var(--muted); background: var(--chip-bg);
  border-radius: 999px; padding: 0.05rem 0.5rem; margin-left: auto;
}
.cap-body p { margin: 0.4rem 0 0; font-size: 0.88rem; }
.cap-body .status-prose, .cap-body .decided { color: var(--muted); }
.cap-body .unverified-aspect { color: var(--partial); font-weight: 500; }
.cap-body .tests, .cap-body .captures {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; color: var(--muted);
  white-space: pre-wrap; word-break: break-word;
}
.cap-body .source { font-size: 0.75rem; color: var(--muted); }
.hidden { display: none; }

</style>
</head>
<body>
<header>
  <h1>Mergewright capabilities</h1>
  <p class="sub">Generated from <code>docs/capabilities/*.md</code> by
    <code>cargo run -p mergewright-capabilities --bin gen-capabilities</code>.
    Do not edit this file by hand.</p>
</header>
<div id="stats" class="stats"></div>
<div class="controls">
  <input id="search" type="search" placeholder="Search id, title, behaviour, tests…" autocomplete="off">
  <select id="area"><option value="">All areas</option><option value="conflicts">conflicts</option><option value="credentials">credentials</option><option value="diffs">diffs</option><option value="foundations">foundations</option><option value="graph">graph</option><option value="hints-and-ui">hints-and-ui</option><option value="history">history</option><option value="mistake-radar">mistake-radar</option><option value="remotes">remotes</option><option value="stash">stash</option><option value="terminal-rendering">terminal-rendering</option><option value="undo">undo</option><option value="working-tree">working-tree</option></select>
  <select id="status">
    <option value="">All statuses</option>
    <option value="works">works</option>
    <option value="partial">partial</option>
    <option value="unverified">unverified</option>
    <option value="broken">broken</option>
  </select>
  <select id="milestone"><option value="">All milestones</option><option value="m0-foundations">m0-foundations</option><option value="m1-the-graph">m1-the-graph</option><option value="m2-details-and-diffs">m2-details-and-diffs</option><option value="m3-working-tree-undo-and-stash">m3-working-tree-undo-and-stash</option><option value="m4-remotes">m4-remotes</option><option value="m5-history-and-ghost-preview">m5-history-and-ghost-preview</option></select>
  <label class="aspect-filter">
    <input id="aspect" type="checkbox">
    has unverified aspect
  </label>
  <span id="count" class="count"></span>
</div>
<div id="rows"></div>
<template id="row-template">
  <article class="cap">
    <div class="cap-head">
      <span class="id"></span>
      <span class="status"></span>
      <span class="title"></span>
      <span class="area-badge"></span>
    </div>
    <div class="cap-body">
      <p class="how"></p>
      <p class="behaviour"></p>
      <p class="status-prose"></p>
      <p class="unverified-aspect"></p>
      <p class="tests"></p>
      <p class="captures"></p>
      <p class="decided"></p>
      <p class="source"></p>
    </div>
  </article>
</template>

ot by floor-dividing","area":"graph","milestone":"m1-the-graph","status":"works","unverified_aspect":"","status_prose":"works, verified against real git, not just internal self-consistency.","decided_in":"design finding from a live user bug report, not a pre-written spec section.","source_file":"docs/capabilities/m1-the-graph.md","source_line":208,"tests":["mergewright_ui::graph_screen::columns::tests::matches_git_log_date_relative_at_every_boundary"],"captures":["docs/shots/48-relative-dates.txt","docs/shots/53-relative-dates-fixed-clock.txt"]},{"id":"M1-07","title":"Lanes stay distinguishable without relying on colour — at full colour, 16 colours, and with colour off entirely","area":"graph","milestone":"m1-the-graph","status":"partial","unverified_aspect":"lane-colour distinguishability by eye at truecolor/256, and by an actual colour-vision-deficient viewer","status_prose":"partial. The dashing mechanism is corpus-tested (same-colour neighbours never share a glyph) and pty-replayed, but two related judgments stay explicitly open in `KNOWN_GAPS.md`, expiry M1 checkpoint: at truecolor/256 colours, neighbouring lanes can still share a hue (a 1-in-12 hash collision, told apart only by column position); and the 12-hue palette itself was chosen numerically (OKLab distance + colour-vision-deficiency simulation) but has never been judged as thin graph lines by an actual colour-vision-deficient viewer. Per this project's rules, a captured terminal stream can't prove colour either way — these stay open until someone looks.","decided_in":"ADR-0019.","source_file":"docs/capabilities/m1-the-graph.md","source_line":237,"tests":[],"captures":["docs/shots/13-foxtrot-merge-16.txt","docs/shots/13-foxtrot-merge-no-color.txt","docs/shots/13-criss-cross-merge-16.txt","docs/shots/13-criss-cross-merge-no-color.txt","docs/shots/12c-palette16-chrome.txt"]},{"id":"M1-08","title":"Too many lanes for the width fold down to a budget, without losing the graph's shape","area":"graph","milesto ed as a known limitation rather than a defect.","decided_in":"`docs/design/05-visualization.md` §5.2 (Focus mode); the pixel-tier rule that dimming is alpha-only, never a heavier stroke, traces to ADR-0024.","source_file":"docs/capabilities/m1-the-graph.md","source_line":374,"tests":[],"captures":["docs/shots/16-criss-cross-focus.txt","docs/shots/16-criss-cross-focus-esc.txt","docs/shots/16-criss-cross-highlight.txt"]},{"id":"M1-11","title":"Mouse: click to select, wheel to scroll","area":"graph","milestone":"m1-the-graph","status":"works","unverified_aspect":"","status_prose":"works.","decided_in":"`PROMPT.md` §3 \"Mouse\".","source_file":"docs/capabilities/m1-the-graph.md","source_line":404,"tests":["mergewright::history::tests::a_wheel_scroll_during_a_far_seek_withdraws_the_seek"],"captures":["docs/shots/17-mouse-select-and-tooltip.txt","docs/shots/32-wheel-before.txt","docs/shots/32-wheel-after.txt"]},{"id":"M1-12","title":"Hovering or peeking a truncated row shows its full subject in the footer","area":"graph","milestone":"m1-the-graph","status":"works","unverified_aspect":"","status_prose":"works.","decided_in":"ADR-0023 (supersedes ADR-0020, the original tooltip design).","source_file":"docs/capabilities/m1-the-graph.md","source_line":434,"tests":["mergewright_ui::graph_screen::tests::a_reveal_replaces_the_hints_with_the_full_subject","mergewright_ui::graph_screen::tests::revealing_a_row_that_was_never_truncated_leaves_the_hints_alone","mergewright_ui::graph_screen::tests::no_reveal_shows_the_ordinary_hints","mergewright_ui::graph_screen::tests::escape_sequences_render_inert_in_the_reveal","mergewright::view::tests::a_reveal_renders_an_escape_sequence_inert","mergewright::view::tests::hover_names_the_reveal_row"],"captures":["docs/shots/41-hover-reveal.txt","docs/shots/41-peek.txt","docs/shots/41-no-reveal.txt"]},{"id":"M1-13","title":"`y` copies the selected commit's full SHA to the system clipboard","area":"graph","milestone":"m1-the-graph","status":"partia t","docs/shots/21-tiny-sizes-launch-0x0.txt","docs/shots/21-tiny-sizes-launch-1x1.txt"]},{"id":"M1-18","title":"Typed keystrokes are never lost or mistaken for a terminal's protocol reply","area":"terminal-rendering","milestone":"m1-the-graph","status":"works","unverified_aspect":"","status_prose":"works. One decoder gap named and accepted, not planned unless it's actually seen: `urxvt`'s own `1015` mouse-reporting variant isn't decoded (xterm, SS3, Kitty's `CSI u`, and SGR/X10 mouse all are).","decided_in":"ADR-0013 (own input decoder, not `crossterm::event::read`).","source_file":"docs/capabilities/m1-the-graph.md","source_line":663,"tests":[],"captures":["docs/shots/20-typeahead-f2-during-probe.txt"]},{"id":"M1-19","title":"Scrolling stays smooth (under a 16 ms input-to-frame budget) at real scale, in every tier","area":"graph","milestone":"m1-the-graph","status":"works","unverified_aspect":"","status_prose":"works, release-only by design; debug is recorded, not gated. The idle-wake residual above is reported in `KNOWN_GAPS.md`, not fixed.","decided_in":"ADR-0021 (frame budgets fail only in release builds; a release perf run is part of every milestone review, not just this one).","source_file":"docs/capabilities/m1-the-graph.md","source_line":698,"tests":["mergewright::history::tests::every_key_draws_from_rows_on_hand_while_the_worker_answers_a_key_late"],"captures":[]},{"id":"M1-20","title":"Reading a repository with tens of thousands of refs stays within budget","area":"graph","milestone":"m1-the-graph","status":"works","unverified_aspect":"","status_prose":"works in release. Debug-build first paint at 50k refs stays over budget (494 ms); explicitly won't-fix — release is the gate, debug numbers are recorded only, and re-measuring debug further was judged to buy nothing (`KNOWN_GAPS.md`).","decided_in":"part of the same ADR-0021 release-only budget policy as M1-19.","source_file":"docs/capabilities/m1-the-graph.md","source_line":734,"tests":["mergewright::many_refs::tests::reading_tips_from_50k_real_refs_is_within_budget","mergewright_git::repo::tests::refs_sharing_commits_or_naming_no_commit_peel_the_same_loose_or_packed"],"captures":[]},{"id":"M1-21","title":"Every event-loop tick stays cheap even with a large ref set on screen","area":"graph","milestone":"m1-the-graph","status":"works","unverified_aspect":"","status_prose":"works. One small, honestly reported oddity: the pixel tier's *max* frame time at 50k refs rose slightly after this fix (its p99 fell) — noted as unexplained but still comfortably under budget, not chased further.","decided_in":"finding from the M1 review's first round, not a pre-written ticket.","source_file":"docs/capabilities/m1-the-graph.md","source_line":762,"tests":["mergewright::update::tests::the_next_state_shares_the_ref_badges_instead_of_copying_them"],"captures":[]},{"id":"M1-22","title":"The graph never freezes on a blank frame while scrolling in the pixel tier","area":"terminal-rendering","milestone":"m1-the-graph","status":"works","unverified_aspect":"","status_prose":"works.","decided_in":"bug found during the user's gallery walkthrough, not a pre-written ticket.","source_file":"docs/capabilities/m1-the-graph.md","source_line":788,"tests":[],"captures":["docs/shots/37-wheel-scroll-placements.txt","docs/shots/user-37-git-git-pixel-after-scroll.png"]},{"id":"M1-23","title":"A fixed gallery walks 23 real and synthetic repository shapes end to end, with a capture of each","area":"graph","milestone":"m1-the-graph","status":"works","unverified_aspect":"whether each gallery stop reads correctly by eye — explicitly left to the user, not yet done","status_prose":"the mechanism works and is heavily captured; the actual judgment — does each stop read correctly — is **explicitly left to the user**, and the source tickets record that walk-through as not yet done. Known, accepted coverage gaps: no light-theme snapshot exists for any stop; only 3 of the 23 shapes have a pixel-tier capture; one shape (a non-UTF-8 ref name) has no real graph at all because the fixture can't be built on this machine's filesystem.","decided_in":"`PROMPT.md`'s M1 promise, \"the shape of history is obvious at a glance\" — this is the mechanism the checklist in `TESTING.md` uses to check it, one repository shape at a time.","source_file":"docs/capabilities/m1-the-graph.md","source_line":812,"tests":[],"captures":["docs/shots/35-trivial-unicode.txt","docs/shots/35-coverage-matrix.txt","docs/shots/38-gallery-first-frame-and-two-steps.txt","docs/shots/38-list.txt"]},{"id":"M1-24","title":"The graph offers to build a missing commit-graph file, and using it visibly shrinks memory and speeds things up","area":"history","milestone":"m1-the-graph","status":"works","unverified_aspect":"","status_prose":"works, verified on real repositories up to 100k commits. Writing one on a real 1M-commit fixture is also measured (5.1–5.3 s wall) but that specific path was exercised as part of the memory-curve measurement (M1-27), not this ticket's own acceptance run.","decided_in":"ADR-0008 (amended to add the offer, replacing an earlier version where a missing commit-graph was silently accepted).","source_file":"docs/capabilities/m1-the-graph.md","source_line":854,"tests":["mergewright_git::commit_graph::offer_state","mergewright_fixtures::copy_into_temp"],"captures":["docs/shots/54-commit-graph-offer-80.txt","docs/shots/54-commit-graph-offer-120.txt"]},{"id":"M1-25","title":"History scales to a million commits without loading everyone into memory","area":"history","milestone":"m1-the-graph","status":"works","unverified_aspect":"","status_prose":"works, gated in the heavy test tier (`heavy-1m` feature).","decided_in":"ADR-0026 (everything that's O(history) uses a dense, handle-indexed representation, 8–16 bytes/commit; the walk reads the commit-graph, not the object database; rows hydrate near the viewport, not eagerly). This ADR was itself a mid-milestone design correction: the original M1 plan measured 8 erified_aspect":"first paint at 1M commits right after clearing the OS page cache — only ever measured warm","status_prose":"partial by design, and honestly so. Green where gated (peak RSS with a commit-graph, live heap slope without one); explicitly reported-not-gated where the number is still real but the team chose not to fail the build on it (RSS/footprint without a commit-graph). One named, unresolved residual specific to tag/branch-tip badges: annotated tags aren't stored in the commit-graph table by design, so each one still costs one extra object read; after every fix applied, the commit-graph memory slope guard's own bar (originally a single ≤150 bytes/commit figure) is still red under that original number — the team's actual resolution was to split the guard into a ≤50 B/commit heap bar (passing, measured 29–31) and a ≤200 MiB RSS bar (passing, measured 167–169), rather than close the original number, and that split is the currently governing bar (ADR-0026 amendment). Also explicitly reported, not proven: first paint at 1M commits straight after clearing the OS page cache (`sudo purge`) — only ever measured warm, by user-accepted convention (ADR-0027); cold numbers (~0.7–1.0 s) are recorded but not re-verified cold on this machine.","decided_in":"ADR-0026 and its two amendments (the split heap/footprint bar; the tag-tip residual below).","source_file":"docs/capabilities/m1-the-graph.md","source_line":958,"tests":["mergewright::heavy::tests::slopes_per_commit_with_a_commit_graph","mergewright::heavy::tests::budgets_hold_on_the_100k_fixture_with_a_commit_graph","mergewright::heavy::tests::budgets_hold_on_the_100k_fixture_without_a_commit_graph","mergewright::heavy::tests::budgets_hold_on_the_100k_realistic_fixture_with_a_commit_graph","mergewright::heavy::tests::budgets_hold_on_the_100k_realistic_fixture_without_a_commit_graph","mergewright::heavy::tests::budgets_hold_on_the_100k_fixture_with_50k_refs","mergewright::heavy::tests::child_gated_run"],"captures" const rowsEl = document.getElementById('rows');
const template = document.getElementById('row-template');
const statsEl = document.getElementById('stats');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');
const areaEl = document.getElementById('area');
const statusEl = document.getElementById('status');
const milestoneEl = document.getElementById('milestone');
const aspectEl = document.getElementById('aspect');

function renderStats() {
  const counts = { works: 0, partial: 0, unverified: 0, broken: 0 };
  let withAspect = 0;
  for (const c of CAPABILITIES) {
    counts[c.status] = (counts[c.status] || 0) + 1;
    if (c.unverified_aspect) withAspect += 1;
  }
  statsEl.innerHTML = '';
  for (const key of ['works', 'partial', 'unverified', 'broken']) {
    const div = document.createElement('div');
    div.className = 'stat';
    div.textContent = key + ': ' + counts[key] + ' / ' + CAPABILITIES.length;
    statsEl.appendChild(div);
  }
  const aspectDiv = document.createElement('div');
  aspectDiv.className = 'stat';
  aspectDiv.textContent = 'carry unverified aspect: ' + withAspect + ' / ' + CAPABILITIES.length;
  statsEl.appendChild(aspectDiv);
}

function renderRows() {
  const q = searchEl.value.trim().toLowerCase();
  const area = areaEl.value;
  const status = statusEl.value;
  const milestone = milestoneEl.value;
  const aspectOnly = aspectEl.checked;

  rowsEl.innerHTML = '';
  let shown = 0;
  for (const cap of CAPABILITIES) {
    if (area && cap.area !== area) continue;
    if (status && cap.status !== status) continue;
    if (milestone && cap.milestone !== milestone) continue;
    if (aspectOnly && !cap.unverified_aspect) continue;
    if (q) {
      const hay = (cap.id + ' ' + cap.title + ' ' + cap.status_prose + ' ' +
        cap.decided_in + ' ' + cap.unverified_aspect + ' ' + cap.tests.join(' ')).toLowerCase();
      if (!hay.includes(q)) continue;
    }
    shown += 1;
    const node = template.content.cloneNode(true);
    node.querySelector('.id').textContent = cap.id;
    const statusSpan = node.querySelector('.status');
    statusSpan.textContent = cap.status;
    statusSpan.classList.add(cap.status);
    node.querySelector('.title').textContent = cap.title;
    node.querySelector('.area-badge').textContent = cap.area + ' · ' + cap.milestone;
    node.querySelector('.status-prose').textContent = 'Status: ' + cap.status_prose;
    const aspectP = node.querySelector('.unverified-aspect');
    if (cap.unverified_aspect) {
      aspectP.textContent = 'Unverified aspect: ' + cap.unverified_aspect;
    } else {
      aspectP.remove();
    }
    node.querySelector('.tests').textContent =
      cap.tests.length ? 'Proven by: ' + cap.tests.join('\n') : 'Proven by: (none cited)';
    node.querySelector('.captures').textContent =
      cap.captures.length ? 'Looks like: ' + cap.captures.join(', ') : '';
    node.querySelector('.decided').textContent = cap.decided_in ? 'Decided in: ' + cap.decided_in : '';
    node.querySelector('.source').textContent = cap.source_file + ':' + cap.source_line;
    node.querySelector('.how').remove();
    node.querySelector('.behaviour').remove();
    rowsEl.appendChild(node);
  }
  countEl.textContent = shown + ' / ' + CAPABILITIES.length + ' shown';
}

for (const el of [searchEl, areaEl, statusEl, milestoneEl, aspectEl]) {
  el.addEventListener('input', renderRows);
}
renderStats();
renderRows();

</script>
