[workspace]
members = ["crates/*"]
exclude = ["prototypes/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Test-only: a dev-dependency everywhere it is used, so it is not an
# internal dependency edge (ADR-0006).
mergewright-fixtures = { path = "crates/mergewright-fixtures" }
mergewright-core = { path = "crates/mergewright-core" }
mergewright-graph = { path = "crates/mergewright-graph" }
mergewright-git = { path = "crates/mergewright-git" }
mergewright-ops = { path = "crates/mergewright-ops" }
mergewright-term = { path = "crates/mergewright-term" }
mergewright-ui = { path = "crates/mergewright-ui" }

# Error types are declarations, not `Display` implementations to be
# hand-written and kept in step (PROMPT.md 6.2). Only the crates that define
# an error type depend on it.
thiserror = "2.0.20"
# The undo journal is JSONL (DESIGN.md §6.1): `mergewright-core` derives the entry
# shape, `mergewright-ops` writes and parses the lines. Versions match `crates/mergewright`.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Wipes the credential prompt's typed password on drop and on every clone
# (`mergewright_ui::text_input::SecretField`, M5 secret-field ticket): a plain
# assignment can be optimised away as a dead store, so zeroing needs the
# volatile-write + compiler-barrier pair this crate provides. Shared between
# `mergewright-ui` (where the field lives) and `graft` (where the answer is built
# and handed to `mergewright-git`'s own `Secret`), at one version. `alloc` only.
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }

# PROMPT.md 6.2's "enforced, not hoped for": every rule that a lint can check
# is a lint, so the gate catches it instead of a reviewer. Each crate root
# also carries `#![forbid(unsafe_code)]`. Two crates are the exceptions and
# each says why at its root: `mergewright-term` (ADR-0013) and `mergewright-fixtures`
# (ADR-0015).
[workspace.lints.rust]
# Every public item has a doc comment.
missing_docs = "warn"
unsafe_code = "deny"

# No `unwrap()` or `expect()` outside tests (PROMPT.md 6.3). `clippy.toml`
# re-allows both inside `#[cfg(test)]`.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# The whole pedantic group, with the noisy members allowed below, each with a
# reason. Negative priority so those individual allows win over the group.
pedantic = { level = "warn", priority = -1 }
# Not in pedantic: the two size lints PROMPT.md 6.2 names by hand. Their
# thresholds are in `clippy.toml`.
cognitive_complexity = "warn"
too_many_lines = "warn"
# Every `#[allow]` carries `reason = "…"` (PROMPT.md 6.2).
allow_attributes_without_reason = "warn"

# The pedantic members that are allowed, each with its reason (PROMPT.md 6.2
# permits exactly this, in one place).
#
# Every error type here is an enum whose variants carry their own doc
# comments and whose `Display` is the message the user reads. A `# Errors`
# section would restate the return type in prose.
missing_errors_doc = "allow"
# `#[must_use]` is used deliberately on the constructors and view models where
# dropping the value is a real mistake. Blanketing it over every getter turns
# it into noise that stops meaning anything.
must_use_candidate = "allow"
# The alternative is `write!` into a `String`, which returns a `Result` that
# cannot fail and would then have to be discarded — the ignored error CLAUDE.md
# forbids, in the one place it genuinely is safe. `push_str(&format!(..))` says
# the same thing without the lie.
format_push_string = "allow"
# The structs this fires on — a terminal's capabilities, an input event — are
# records of independent yes/no facts, not state machines. Collapsing them into
# enums would invent combinations that do not exist and lose the ones that do.
struct_excessive_bools = "allow"

# Lighter debug info: less memory to link, less disk used (PROMPT.md 7.1).
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# The release build dist makes (m8-polish-and-ship/24). `release` plus thin
# LTO, as `dist init` writes it.
[profile.dist]
inherits = "release"
lto = "thin"

# Release config for `dist` (axodotdev, v0.33; docs/research/install-docs.md
# §2). Four targets (ADR-0005: macOS and Linux only) and the curl installer.
# `<owner>` is filled in at publishing.
#
# The Homebrew formula is not dist's: its template is compiled in and puts the
# man page in `pkgshare` (ADR-0057 amendment §11). Ours is
# `packaging/homebrew/mergewright.rb.in`, filled from dist's manifest by
# `scripts/formula.py`; so no `homebrew` installer and no `tap` here.
#
# `publish-jobs = []`: dist publishes nothing — no tap push, no release —
# until a person has run the trademark search (ADR-0057 §1). Today it runs
# `dist plan` and `dist build` locally only; the workflow it generated
# (.github/workflows/release.yml) is committed and never pushed.
[workspace.metadata.dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["shell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
publish-jobs = []
# release.yml is hand-edited to `workflow_dispatch` only (its "Disarmed"
# block), so it no longer matches what `dist generate` would write; without
# this `dist plan` refuses to run.
allow-dirty = ["ci"]
# `~/.cargo/bin`, where `cargo install` puts it, so both ways of installing
# land in the same place.
install-path = "CARGO_HOME"
# No self-updater: Homebrew, or a re-run of the installer, updates it.
install-updater = false
