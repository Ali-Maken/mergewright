[package]
name = "graft-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# No internal dependencies: `core` is the root of the layering (ARCHITECTURE.md).
[dependencies]
thiserror.workspace = true
# The journal entry (`journal.rs`) is the one core type that is also a file
# format; serde stays an external, behaviour-free derive.
serde.workspace = true

[lints]
workspace = true

[dev-dependencies]
# `HandleSet`'s model test against `HashSet` (PROMPT.md §7.1 names proptest).
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
# The journal is a file format, so its serde shape is asserted as bytes —
# `IndexState`'s backward compatibility above all (m6-conflicts/08).
serde_json.workspace = true
