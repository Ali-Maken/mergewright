[package]
name = "mergewright-term"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mergewright-core.workspace = true
# `poll`, `read` and the `TIOCGWINSZ` ioctl, for the one module that talks to
# the real terminal (`detect::tty`). No crate wraps those three without also
# owning the event loop, which `app` owns.
libc = "0.2"
# PNG for iTerm2 inline images (OSC 1337 takes a file, not raw RGBA).
# `Compression::Fast` because encode time is frame budget (ADR-0012).
png = { version = "0.18", default-features = false }
# zlib (RFC 1950) for Kitty's `o=z` transmits (ticket m7/45). Already in the
# lock through `png` (0.8.9), so no new package: pure Rust, and a one-call
# `compress_to_vec_zlib` with no stream state to manage.
miniz_oxide = "0.8"

[dev-dependencies]
# Property tests for the sanitiser (PROMPT.md §7.1 mandates `proptest` and
# caps the fast tier at 64 cases). Default features off: `fork` and `timeout`
# would pull in a process-spawning harness the sanitiser's pure tests never
# need.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
# The tier the tests are running in: `mergewright_fixtures::proptest_cases()` is 64
# in the fast tier and 1000 in the heavy one, so the count is not a number
# copied into each test module.
mergewright-fixtures.workspace = true

# Forwards to `mergewright-fixtures`, so one `cargo test --features heavy-tests`
# turns the tier on across the workspace. See TESTING.md.
[features]
heavy-tests = ["mergewright-fixtures/heavy-tests"]

[lints]
workspace = true
