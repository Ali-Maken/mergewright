[package]
name = "graft"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `app` is the only crate allowed to see every other crate (ARCHITECTURE.md).
[dependencies]
graft-core.workspace = true
graft-git.workspace = true
graft-graph.workspace = true
graft-ops.workspace = true
graft-term.workspace = true
graft-ui.workspace = true

# `tests/it/dependency_edges.rs` parses `cargo metadata`'s JSON. `serde_json`
# alone is enough for that; the `cargo_metadata` crate would pull a much larger
# tree for typed structs this one test doesn't need.
[dev-dependencies]
serde_json = "1.0.151"

[lints]
workspace = true
