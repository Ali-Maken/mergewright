[package]
name = "graft-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
graft-core.workspace = true
graft-graph.workspace = true
graft-term.workspace = true
# The drawing half of the loop (PROMPT.md Technology). No backend feature
# here: `ui` builds widgets and never owns a terminal, so `std` is all it
# needs — the backend, and the crossterm version behind it, are `app`'s
# choice.
ratatui = { version = "0.30", default-features = false, features = ["std"] }
# How many cells a character takes, for clamping text to an exact width
# (`fit`). Already in the build through ratatui, at this version.
unicode-width = "0.2"

[dev-dependencies]
# Snapshot of every resolved token, in every theme, at every colour depth
# (PROMPT.md §7.1). A colour table is exactly the kind of thing nobody reviews
# by eye twice.
insta = "1"
# The named corpus the graph column's snapshots draw, read through `git` the
# way `graph`'s own corpus test does. Dev-only: not an ADR-0006 crate edge.
graft-fixtures.workspace = true
graft-git.workspace = true

[lints]
workspace = true
