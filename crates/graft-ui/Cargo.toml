[package]
name = "graft-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
graft-core.workspace = true
graft-graph.workspace = true
graft-term.workspace = true
# The drawing half of the loop (PROMPT.md Technology). No backend feature
# here: `ui` builds widgets and never owns a terminal, so `std` is all it
# needs — the backend, and the crossterm version behind it, are `app`'s
# choice.
ratatui = { version = "0.30", default-features = false, features = ["std"] }
# Word-level diffs inside a paired line (`diff_words`, PROMPT.md Technology
# "imara-diff or similar"). Default features only: no `unicode-segmentation`
# grapheme mode, no `bstr`/`bytes` — word tokenising over `&str` is enough.
similar = "3.2.0"
# Line-level syntax highlighting (`syntax`, PROMPT.md Technology "syntect or
# tree-sitter-highlight"). `onig` is a C dependency this workspace avoids
# elsewhere; `regex-fancy` is the pure-Rust regex engine syntect's own syntax
# definitions need. No default themes: `theme.rs` maps roles onto Graft's own
# tokens instead of shipping syntect's colours.
syntect = { version = "5.3.0", default-features = false, features = [
    "default-syntaxes",
    "regex-fancy",
] }
# How many cells a character takes, for clamping text to an exact width
# (`fit`). Already in the build through ratatui, at this version.
unicode-width = "0.2"
# `SecretField`'s zeroizing buffer (see the workspace `Cargo.toml` for why).
zeroize.workspace = true

[dev-dependencies]
# PROMPT.md §6.3 / §7.1: the hot paths benchmarked with `criterion`, run
# only at milestone reviews with short runs (m1-the-graph/30). Default
# features off: no plotting, no rayon.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Snapshot of every resolved token, in every theme, at every colour depth
# (PROMPT.md §7.1). A colour table is exactly the kind of thing nobody reviews
# by eye twice.
insta = "1"
# `syntax::highlight` never panics or yields an overlapping/out-of-range span,
# over arbitrary text (PROMPT.md §7.1 mandates proptest; same feature set as
# `graft-term`'s sanitiser tests).
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
# The named corpus the graph column's snapshots draw, read through `git` the
# way `graph`'s own corpus test does. Dev-only: not an ADR-0006 crate edge.
graft-fixtures.workspace = true
graft-git.workspace = true

[lints]
workspace = true

# Not in `cargo test` (bench targets are not test targets by default); run at
# milestone reviews: `cargo bench -p graft-ui -- --warm-up-time 1 --measurement-time 3`.
[[bench]]
name = "row_render"
harness = false
