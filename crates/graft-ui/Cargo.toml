[package]
name = "graft-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
graft-core.workspace = true
graft-graph.workspace = true
graft-term.workspace = true
# The drawing half of the loop (PROMPT.md Technology). No backend feature
# here: `ui` builds widgets and never owns a terminal, so `std` is all it
# needs — the backend, and the crossterm version behind it, are `app`'s
# choice.
ratatui = { version = "0.30", default-features = false, features = ["std"] }

[dev-dependencies]
# Snapshot of every resolved token, in every theme, at every colour depth
# (PROMPT.md §7.1). A colour table is exactly the kind of thing nobody reviews
# by eye twice.
insta = "1"

[lints]
workspace = true
