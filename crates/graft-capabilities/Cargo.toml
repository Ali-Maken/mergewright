[package]
name = "graft-capabilities"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Repo metadata tooling, not product code (docs/capabilities/README.md). It
# parses `docs/capabilities/*.md`, checks every citation in it against the
# repository on disk, and generates `CAPABILITIES.md` and the browsable page.
# It depends on no other Graft crate, and nothing may depend on it: dropping
# it changes no product behaviour, only whether the capability database can
# be regenerated and checked. Never `path`-referenced from `workspace.dependencies`
# — that list is for crates something else builds on.
[dependencies]
thiserror.workspace = true

[lints]
workspace = true

[[bin]]
name = "gen-capabilities"
path = "src/bin/gen_capabilities.rs"
