[package]
name = "mergewright-git"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Reads go through `gix` and nothing else (ADR-0011). Default features off:
# the default set pulls the network clients, the worktree writers and the
# whole diff/blame stack, none of which Mergewright opens a repository with.
#
# What is on, and why:
#   sha1, sha256  - the hash backends. Without one, `gix`'s object-id type
#                   has no variants and the crate does not compile.
#   parallel      - on for correctness, not for speed. It is what makes
#                   `gix::ThreadSafeRepository` `Send + Sync`: without it
#                   `gix-features` swaps `Arc`/`RwLock` for `Rc`/`RefCell`,
#                   and `SharedRepo` — one repository shared by every job
#                   thread — does not compile. Measured below it is worth
#                   nothing; it is here because the alternative is
#                   re-opening the repository per job.
#
# Measured before deciding (m1-the-graph/04). Fixture: `mergewright-fixtures`'
# synthetic 20,000-commit repository with no commit-graph file
# (`Scale::of(20_000)`), and a `git clone --no-local` copy of it repacked
# `-adf --depth=250 --window=250` to give the delta chains a `git gc
# --aggressive` would. Method: release build, one full commit-date `Walk`
# over all refs, 500-commit chunks, best of three rounds. Times in
# milliseconds, with and without the 16 MiB per-handle object cache
# (`SharedRepo::OBJECT_CACHE_BYTES`):
#
#   feature set                          plain fixture   deep deltas
#   sha1+sha256                          56.8 / 82.4     -
#   + parallel                           56.3 / 81.4     55.0 / 79.9
#   + pack-cache-lru-static and -dynamic 57.2 / 81.9     55.8 / 80.2
#
# So the pack delta caches are off: they made no measurable difference even
# against depth-250 chains, and a feature that buys nothing is a dependency
# with no payer. The object cache is the one that pays — 82.4 -> 56.8 ms,
# about a third — and it is code, not a feature.
#
# Still off: `revision` (it drags in `gix-index`, and the rev-walk needs
# neither `describe` nor `merge_base`), `blame`. The commit-graph reader is
# not a feature at all: `gix-commitgraph` is a hard dependency of `gix`.
#
#   mailmap - on since m1-the-graph/10: the author chip needs `.mailmap`
#             resolution, and `Repository::open_mailmap()` is the only way
#             to get it without a second `.mailmap` parser (ADR-0011).
#   status  - on since m1-the-graph/12: the uncommitted-changes row needs
#             staged/unstaged/untracked counts, and `Repository::status()`
#             is gix's own index/worktree walk (ADR-0011 forbids shelling
#             out to `git status` for this). Pulls in `gix-status`, the
#             dirwalk, `gix-index` and `gix-diff`'s index comparison.
gix = { version = "0.87.1", default-features = false, features = [
    "sha1",
    "sha256",
    "parallel",
    "mailmap",
    "status",
] }
mergewright-core.workspace = true
thiserror.workspace = true
# `conflict::blob_id`: git's blob id of a working-tree file, computed locally
# so a resolver write can refuse a file that changed underneath it without a
# `hash-object` spawn per keypress (m6-conflicts/01). Plain SHA-1 rather than
# gix's collision-checked hasher: that hasher can only fail on an input git
# itself refuses to hash, and a fingerprint has no honest value then. Already
# in the tree under `gix`, so no new code is compiled.
sha1 = "0.10"
# `conflict::write_back` (a temporary beside the file, renamed over it) and
# `conflict::diff3_blocks` (the three stages in a scratch directory for
# `git merge-file`). Was a dev-dependency; the same version, now shipped.
tempfile = "3.27.0"
# `run::askpass`: the askpass server serves only a peer with our own uid
# (`getpeereid` on macOS/BSD, `SO_PEERCRED` on Linux; m8-polish-and-ship/21).
# std's `UnixStream::peer_cred` is still unstable (1.98) and this crate
# forbids `unsafe`, so the call goes through nix's safe wrappers rather than
# raw `libc`. External, not an internal edge, so ARCHITECTURE.md's crate
# table is unchanged; `libc`, `bitflags` and `cfg-if` are already in the tree.
#
# `signal` (m8-polish-and-ship/13c): `run` gives every git child its own
# process group and a stop signals it — `killpg`, `kill` — so a hung hook
# ends with git. Before 13c the stop shelled out to `kill(1)` for SIGTERM and
# reached git's pid only. It also pulls nix's `process` (`Pid`, `getpgid`).
#
# `fs` (m8-polish-and-ship/26): `file_lock`'s advisory `flock`, shared and
# exclusive, which the one-time rename takes on `<common_dir>/tributary/lock`
# so two windows never move the names under each other. std's
# `File::lock`/`try_lock` would do it but need Rust 1.89 and the workspace
# MSRV is 1.88; `fs` compiles no new crate (an empty feature in nix).
nix = { version = "0.29", default-features = false, features = ["socket", "user", "signal", "fs"] }

[features]
# Turns the heavy tier on for this crate's tests, per TESTING.md. A crate
# that uses the heavy fixtures forwards the flag rather than naming
# `mergewright-fixtures`' feature at the command line, so one
# `cargo test --features heavy-tests` at the workspace root reaches all of
# them at once.
heavy-tests = ["mergewright-fixtures/heavy-tests"]

[lints]
workspace = true

# Timing for `scripts/m7-perf-blame.sh` (m7-power-tools/18): the heavy
# synthetic repository exists only with `heavy-tests`.
[[example]]
name = "trace_perf"
required-features = ["heavy-tests"]

# Timing for `scripts/m7-perf-lost.sh` (m7-power-tools/19): three ways of
# finding lost commits on the heavy repository with 50k refs.
[[example]]
name = "lost_cost"
required-features = ["heavy-tests"]

# m7-power-tools/14a: `scripts/m7-stash-only-cost.sh` — `only_in_stash`'s
# cost on the same fixture.
[[example]]
name = "stash_only_cost"
required-features = ["heavy-tests"]

[dev-dependencies]
# The named fixture corpus (m1-the-graph/01). A dev-dependency only, so it is
# not an internal dependency edge (ADR-0006). Optional so that the
# `heavy-tests` feature above has something to forward to; it is pulled in by
# every test build regardless, because dev-dependencies are not optional in
# practice — the feature only chooses which tier it builds.
mergewright-fixtures.workspace = true
# Property tests for `diff::pairs` (PROMPT.md §7.1 mandates `proptest`, capped
# at 64 fast-tier cases). Default features off: `fork`/`timeout` would pull in
# a process-spawning harness this pure function never needs.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
