[package]
name = "mergewright-fixtures"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Test-only. Nothing in the shipped binary may depend on this crate: it is a
# dev-dependency everywhere it is used, so it never appears in an internal
# dependency edge (ARCHITECTURE.md, ADR-0006). It deliberately depends on no
# other Mergewright crate either, so the corpus can be built before anything that
# reads it exists.
[dependencies]
thiserror.workspace = true

# A fixture a test wants to write to is copied into a temporary directory that
# is deleted when the test ends (PROMPT.md 7.1).
tempfile = "3.27.0"

# `getrusage`, for the peak-memory helper the heavy tier's 300 MB budget is
# measured with (PROMPT.md 7.1 names the call). One `unsafe` site, ADR-0015.
libc = "0.2"

# Smart HTTP for the remote fixtures (`remote::HttpRemote`) needs no crate:
# the fixture owns its `std::net::TcpListener` and speaks the little HTTP/1.1
# `git http-backend` needs itself. 2026-10-07 (m8 13i/13j): `tiny_http` was
# dropped because it never joins its accept thread, so the port could still
# accept after the fixture's `drop` returned.

# The heavy tier (PROMPT.md 7.1): the synthetic repository of 100k commits and
# every test that reads it. Off by default, so a fast-tier `cargo test` cannot
# compile — let alone run — anything that generates a fixture that large.
#
# A crate that grows a heavy test declares its own forwarding feature:
#
#     [features]
#     heavy-tests = ["mergewright-fixtures/heavy-tests"]
#
# so that one `cargo test --features heavy-tests` at the workspace root turns
# the tier on everywhere at once. See TESTING.md.
[features]
heavy-tests = []

[lints]
workspace = true

# Builds one synthetic repository of any size, for the memory curve (m1/46).
[[example]]
name = "synthetic"
required-features = ["heavy-tests"]
